<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Напоминатор — дизайн</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-6"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16M4 15h16M10 4v16"/></symbol>
    <symbol id="i-today" viewBox="0 0 24 24"><path d="M4 7l2 2 3-3M12 8h8M4 16l2 2 3-3M12 17h8"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s6-5.5 6-11a6 6 0 1 0-12 0c0 5.5 6 11 6 11z"/><circle cx="12" cy="10" r="2"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M3 9a13 13 0 0 1 18 0M6 12.5a8.5 8.5 0 0 1 12 0M9 16a4 4 0 0 1 6 0M12 19.5h.01"/></symbol>
    <symbol id="i-bt" viewBox="0 0 24 24"><path d="M7 8l10 8-5 4V4l5 4-10 8"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3zM12 10v4M12 17h.01"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7z"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
  </defs>
</svg>

<header class="top">
  <div>
    <h1>Напоминатор</h1>
    <p>Макеты экранов v1 по <b>TZ.md</b>. Условная «сегодня»: четверг, 22 октября 2026. Тема переключается справа; в режиме «Система» берётся тема устройства.</p>
  </div>
  <div class="seg-theme" role="group" aria-label="Тема">
    <button data-theme-set="light" aria-pressed="true">Светлая</button>
    <button data-theme-set="dark" aria-pressed="false">Тёмная</button>
    <button data-theme-set="system" aria-pressed="false">Система</button>
  </div>
</header>

<main class="board">

<h2 class="group-title">Основные вкладки</h2>

<!-- 1. Сегодня -->
<figure class="item">
  <figcaption>1. Сегодня <span>список дня</span></figcaption>
  <div class="phone">
    <div class="appbar">
      <div><h2>Сегодня</h2><div class="sub">четверг, 22 октября</div></div>
      <button class="icon-btn" aria-label="Поиск"><svg class="ic"><use href="#i-search"/></svg></button>
    </div>
    <div class="content">
      <div class="card">
        <div class="row"><b class="grow">Выполнено 4 из 9</b><span class="muted small">осталось 5</span></div>
        <div class="progress"><i style="width:44%"></i></div>
      </div>

      <div class="rem due">
        <div class="row" style="width:100%">
          <div class="time">13:00</div>
          <div class="grow"><div class="title">Таблетки (обед)</div>
            <div class="row" style="gap:6px;margin-top:4px"><span class="chip warn"><svg class="ic sm"><use href="#i-repeat"/></svg>повтор через 10 мин</span><span class="chip">здоровье</span></div></div>
        </div>
        <div class="acts">
          <button class="btn primary"><svg class="ic sm"><use href="#i-check"/></svg>Выполнено</button>
          <button class="btn"><svg class="ic sm"><use href="#i-clock"/></svg>Отложить</button>
        </div>
      </div>

      <div class="label">Утро</div>
      <div class="rem done"><div class="time">08:00</div><div class="grow"><div class="title">Вес</div><span class="chip ok">82,1 кг</span></div><button class="check on" aria-label="Выполнено"><svg class="ic"><use href="#i-check"/></svg></button></div>
      <div class="rem done"><div class="time">09:00</div><div class="grow"><div class="title">Зарядка</div></div><button class="check on" aria-label="Выполнено"><svg class="ic"><use href="#i-check"/></svg></button></div>

      <div class="label">Дальше</div>
      <div class="rem"><div class="time">15:30</div><div class="grow"><div class="title">Позвонить маме</div></div><button class="check" aria-label="Отметить"></button></div>
      <div class="rem"><div class="time">18:00</div><div class="grow"><div class="title">Чтение 20 минут</div><span class="chip">личное</span></div><button class="check" aria-label="Отметить"></button></div>
      <div class="rem"><div class="time">21:00</div><div class="grow"><div class="title">Давление</div><span class="chip accent"><svg class="ic sm"><use href="#i-chart"/></svg>ввести значение</span></div><button class="check" aria-label="Ввести"><svg class="ic" style="color:var(--muted)"><use href="#i-edit"/></svg></button></div>
      <div class="rem"><div class="time" style="width:46px"><svg class="ic" style="color:var(--accent)"><use href="#i-pin"/></svg></div><div class="grow"><div class="title">Полить цветы</div><span class="chip accent"><svg class="ic sm"><use href="#i-pin"/></svg>когда приду домой</span></div><button class="check" aria-label="Отметить"></button></div>
    </div>
    <button class="fab" aria-label="Новое напоминание"><svg class="ic lg"><use href="#i-plus"/></svg></button>
    <nav class="tabs" data-nav="today"></nav>
  </div>
</figure>

<!-- 2. Неделя -->
<figure class="item">
  <figcaption>2. Неделя <span>таблица привычек</span></figcaption>
  <div class="phone">
    <div class="appbar">
      <div><h2>Привычки</h2><div class="sub">набор «Здоровье»</div></div>
      <button class="icon-btn" aria-label="Настроить таблицу"><svg class="ic"><use href="#i-list"/></svg></button>
    </div>
    <div class="content">
      <div class="seg"><button aria-pressed="true">Неделя</button><button aria-pressed="false">Месяц</button></div>
      <div class="row" style="justify-content:space-between">
        <button class="icon-btn" aria-label="Предыдущая неделя"><svg class="ic"><use href="#i-left"/></svg></button>
        <button class="btn" style="border:0;background:none;font-size:17px">19–25 октября <svg class="ic sm"><use href="#i-down"/></svg></button>
        <button class="icon-btn" aria-label="Следующая неделя"><svg class="ic"><use href="#i-right"/></svg></button>
      </div>
      <div class="tbl-wrap"><table class="habits" id="week-table"></table></div>
      <div class="legend" id="legend"></div>
      <div class="card small muted">Тап по ячейке: отметить. Долгий тап: пропущено, перенести, комментарий, изменить значение. «Пропущено» ставится автоматически в конце дня.</div>
    </div>
    <nav class="tabs" data-nav="week"></nav>
  </div>
</figure>

<!-- 3. Месяц -->
<figure class="item">
  <figcaption>3. Месяц <span>компактная карта</span></figcaption>
  <div class="phone">
    <div class="appbar">
      <div><h2>Привычки</h2><div class="sub">набор «Здоровье»</div></div>
      <button class="icon-btn" aria-label="Настроить таблицу"><svg class="ic"><use href="#i-list"/></svg></button>
    </div>
    <div class="content">
      <div class="seg"><button aria-pressed="false">Неделя</button><button aria-pressed="true">Месяц</button></div>
      <div class="row" style="justify-content:space-between">
        <button class="icon-btn" aria-label="Предыдущий месяц"><svg class="ic"><use href="#i-left"/></svg></button>
        <button class="btn" style="border:0;background:none;font-size:17px">Октябрь 2026 <svg class="ic sm"><use href="#i-down"/></svg></button>
        <button class="icon-btn" aria-label="Следующий месяц"><svg class="ic"><use href="#i-right"/></svg></button>
      </div>
      <div class="heat" id="heat"></div>
      <div class="legend">
        <span><i style="width:14px;height:14px;border-radius:4px;background:var(--ok);display:inline-block"></i>выполнено</span>
        <span><i style="width:14px;height:14px;border-radius:4px;background:var(--warn);opacity:.75;display:inline-block"></i>частично</span>
        <span><i style="width:14px;height:14px;border-radius:4px;background:var(--miss-soft);box-shadow:inset 0 0 0 1px var(--miss);display:inline-block"></i>пропущено</span>
        <span><i style="width:14px;height:14px;border-radius:4px;background:var(--accent);opacity:.5;display:inline-block"></i>перенесено</span>
      </div>
      <div class="card"><div class="row"><b class="grow">Серия «Зарядка»</b><span class="chip ok">9 дней подряд</span></div><div class="muted small" style="margin-top:4px">Тап по строке открывает карточку привычки, по клетке — день.</div></div>
    </div>
    <nav class="tabs" data-nav="week"></nav>
  </div>
</figure>

<!-- 4. Календарь -->
<figure class="item">
  <figcaption>4. Календарь <span>месяц / неделя / день</span></figcaption>
  <div class="phone">
    <div class="appbar">
      <div><h2>Календарь</h2><div class="sub">октябрь 2026</div></div>
      <button class="icon-btn" aria-label="Фильтр"><svg class="ic"><use href="#i-list"/></svg></button>
    </div>
    <div class="content">
      <div class="seg"><button aria-pressed="true">Месяц</button><button aria-pressed="false">Неделя</button><button aria-pressed="false">День</button></div>
      <div class="cal" id="cal"></div>
      <div class="label">22 октября · четверг</div>
      <div class="rem done"><div class="time">08:00</div><div class="grow"><div class="title">Вес</div></div><svg class="ic" style="color:var(--ok)"><use href="#i-check"/></svg></div>
      <div class="rem"><div class="time">13:00</div><div class="grow"><div class="title">Таблетки (обед)</div></div><span class="chip warn">сейчас</span></div>
      <div class="rem"><div class="time">21:00</div><div class="grow"><div class="title">Давление</div></div><span class="chip">впереди</span></div>
    </div>
    <button class="fab" aria-label="Новое напоминание на выбранную дату"><svg class="ic lg"><use href="#i-plus"/></svg></button>
    <nav class="tabs" data-nav="cal"></nav>
  </div>
</figure>

<!-- 5. Графики -->
<figure class="item">
  <figcaption>5. Графики <span>измерения</span></figcaption>
  <div class="phone">
    <div class="appbar">
      <div><h2>Графики</h2><div class="sub">измерения</div></div>
      <button class="icon-btn" aria-label="Экспорт CSV"><svg class="ic"><use href="#i-down"/></svg></button>
    </div>
    <div class="content">
      <div class="row" style="gap:6px;flex-wrap:wrap">
        <span class="chip accent" style="padding:8px 14px;font-size:14px">Вес</span>
        <span class="chip" style="padding:8px 14px;font-size:14px">Давление</span>
        <span class="chip" style="padding:8px 14px;font-size:14px">Вода</span>
      </div>
      <div class="seg"><button aria-pressed="false">7 дн</button><button aria-pressed="true">30 дн</button><button aria-pressed="false">3 мес</button><button aria-pressed="false">Год</button><button aria-pressed="false">Всё</button></div>
      <div class="card">
        <div class="row" style="align-items:flex-end"><div class="big">81,9<span style="font-size:20px;color:var(--muted);font-weight:700"> кг</span></div><span class="chip ok" style="margin-left:auto"><svg class="ic sm"><use href="#i-down"/></svg>−0,8 за 30 дн</span></div>
        <div style="margin-top:10px" id="chart"></div>
      </div>
      <div class="stats"><div><b>81,4</b><span>мин</span></div><div><b>83,0</b><span>макс</span></div><div><b>82,2</b><span>среднее</span></div><div><b>80,0</b><span>цель</span></div></div>
      <div class="label">Последние значения</div>
      <div class="rem"><div class="grow"><b>22 окт, 08:00</b></div><b>81,9 кг</b><svg class="ic" style="color:var(--muted)"><use href="#i-edit"/></svg></div>
      <div class="rem"><div class="grow"><b>21 окт, 08:05</b></div><b>82,1 кг</b><svg class="ic" style="color:var(--muted)"><use href="#i-edit"/></svg></div>
    </div>
    <nav class="tabs" data-nav="chart"></nav>
  </div>
</figure>

<!-- 6. Ещё -->
<figure class="item">
  <figcaption>6. Ещё <span>меню</span></figcaption>
  <div class="phone">
    <div class="appbar"><div><h2>Ещё</h2></div></div>
    <div class="content">
      <div class="health" style="border-color:var(--warn)"><span class="st bad"><svg class="ic"><use href="#i-alert"/></svg></span><div class="grow"><b>Надёжность</b><span class="muted small">2 настройки мешают точности</span></div><svg class="ic muted"><use href="#i-right"/></svg></div>
      <div class="health"><span class="st ok"><svg class="ic"><use href="#i-list"/></svg></span><div class="grow"><b>Все напоминания</b><span class="muted small">активные, пауза, архив</span></div><svg class="ic muted"><use href="#i-right"/></svg></div>
      <div class="health"><span class="st ok"><svg class="ic"><use href="#i-table"/></svg></span><div class="grow"><b>Наборы привычек</b><span class="muted small">Здоровье, Дом, Работа</span></div><svg class="ic muted"><use href="#i-right"/></svg></div>
      <div class="health"><span class="st ok"><svg class="ic"><use href="#i-pin"/></svg></span><div class="grow"><b>Категории и теги</b></div><svg class="ic muted"><use href="#i-right"/></svg></div>
      <div class="health"><span class="st ok"><svg class="ic"><use href="#i-down"/></svg></span><div class="grow"><b>Импорт и экспорт</b><span class="muted small">JSON, CSV, автобэкап</span></div><svg class="ic muted"><use href="#i-right"/></svg></div>
      <div class="health"><span class="st ok"><svg class="ic"><use href="#i-bell"/></svg></span><div class="grow"><b>Звуки и откладывание</b></div><svg class="ic muted"><use href="#i-right"/></svg></div>
      <div class="health"><span class="st ok"><svg class="ic"><use href="#i-moon"/></svg></span><div class="grow"><b>Тема</b><span class="muted small">Светлая · Тёмная · Как в системе</span></div><svg class="ic muted"><use href="#i-right"/></svg></div>
      <div class="health"><span class="st ok"><svg class="ic"><use href="#i-calendar"/></svg></span><div class="grow"><b>Начало недели</b><span class="muted small">понедельник</span></div><svg class="ic muted"><use href="#i-right"/></svg></div>
    </div>
    <nav class="tabs" data-nav="more"></nav>
  </div>
</figure>

<h2 class="group-title">Создание и ввод</h2>

<!-- 7. Создание -->
<figure class="item">
  <figcaption>7. Новое напоминание <span>конструктор</span></figcaption>
  <div class="phone">
    <div class="appbar">
      <div class="row"><button class="icon-btn" aria-label="Закрыть"><svg class="ic"><use href="#i-x"/></svg></button><h2 style="font-size:22px">Новое</h2></div>
    </div>
    <div class="content" style="gap:8px">
      <div class="field"><small>Название</small><b>Давление</b></div>
      <div class="seg"><button aria-pressed="false">Задача</button><button aria-pressed="true">Измерение</button></div>
      <div class="fields3">
        <div class="field"><small>Величина</small><b>Давление</b></div>
        <div class="field"><small>Единица (вручную)</small><b>мм рт. ст.</b></div>
      </div>
      <div class="row small muted" style="gap:6px;flex-wrap:wrap">Поля: <span class="chip accent">Верхнее</span><span class="chip accent">Нижнее</span><span class="chip accent">Пульс · уд/мин</span><span class="chip"><svg class="ic sm"><use href="#i-plus"/></svg>поле</span></div>

      <div class="label">Когда</div>
      <div class="seg"><button aria-pressed="false">Время</button><button aria-pressed="false">Условие</button><button aria-pressed="true">Время + условие</button></div>
      <div class="days7"><button aria-pressed="true">Пн</button><button aria-pressed="true">Вт</button><button aria-pressed="true">Ср</button><button aria-pressed="true">Чт</button><button aria-pressed="true">Пт</button><button aria-pressed="false">Сб</button><button aria-pressed="false">Вс</button></div>
      <div class="times"><span class="time-chip">08:00 <svg class="ic sm"><use href="#i-x"/></svg></span><span class="time-chip">21:00 <svg class="ic sm"><use href="#i-x"/></svg></span><button class="btn tonal"><svg class="ic sm"><use href="#i-plus"/></svg>время</button></div>
      <div class="field"><div class="row"><svg class="ic" style="color:var(--accent)"><use href="#i-wifi"/></svg><div class="grow"><small>Условие</small><br><b>Подключился к Wi-Fi «Дом-5G»</b></div><svg class="ic muted"><use href="#i-right"/></svg></div></div>
      <div class="row small muted"><span class="grow">Срабатывать</span><div class="seg" style="width:220px"><button aria-pressed="true">раз в 1 час</button><button aria-pressed="false">один раз</button></div></div>

      <div class="label">Уведомление</div>
      <div class="seg"><button aria-pressed="false">Обычный</button><button aria-pressed="true">Важный</button><button aria-pressed="false">Критичный</button></div>
      <div class="field"><div class="row"><div class="grow"><b>Настойчивый повтор</b><br><small>каждые 10 мин, до 6 раз</small></div><span class="switch"></span></div></div>
    </div>
    <div class="footbar"><button class="btn">Отмена</button><button class="btn primary grow">Сохранить</button></div>
  </div>
</figure>

<!-- 8. Ввод значения -->
<figure class="item">
  <figcaption>8. Ввод значения <span>нижний лист</span></figcaption>
  <div class="phone">
    <div class="appbar"><div><h2>Сегодня</h2><div class="sub">четверг, 22 октября</div></div></div>
    <div class="content" style="opacity:.5">
      <div class="card"><b>Выполнено 4 из 9</b><div class="progress"><i style="width:44%"></i></div></div>
      <div class="rem"><div class="time">08:00</div><div class="grow"><div class="title">Вес</div></div></div>
      <div class="rem"><div class="time">09:00</div><div class="grow"><div class="title">Зарядка</div></div></div>
    </div>
    <div class="scrim"></div>
    <div class="sheet">
      <div class="grab"></div>
      <div class="row"><b class="grow" style="font-size:20px">Вес</b><span class="chip">08:00 · сегодня <svg class="ic sm"><use href="#i-edit"/></svg></span></div>
      <div class="value-in"><span class="num">82,1</span><span class="unit">кг</span></div>
      <div class="stepper"><button class="btn" aria-label="Минус 0,5">−0,5</button><button class="btn" aria-label="Минус 0,1">−0,1</button><button class="btn" aria-label="Плюс 0,1">+0,1</button><button class="btn" aria-label="Плюс 0,5">+0,5</button></div>
      <div class="center small muted" style="text-align:center">Вчера: 82,4 кг · цель 80,0 кг · допустимо 40–200</div>
      <div class="field"><small>Комментарий</small><span class="muted">необязательно</span></div>
      <div class="row"><button class="btn">Пропустить</button><button class="btn primary grow">Сохранить</button></div>
    </div>
  </div>
</figure>

<!-- 9. Накопительная величина -->
<figure class="item">
  <figcaption>9. Накопительная величина <span>вода за день</span></figcaption>
